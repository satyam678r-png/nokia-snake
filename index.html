<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nokia Snake</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="phone">
    <div class="phone-screen">
      <div class="status-bar">
        <span class="brand">NOKIA</span>
        <span id="score">Score: 0</span>
      </div>

      <canvas id="game" width="300" height="300"></canvas>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <h2 id="overlay-title">Nokia Snake</h2>
          <p id="overlay-msg">Press Start or Space</p>
          <p id="high-score" class="high-score"></p>
          <button id="start-btn" type="button">START</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button class="btn up" data-dir="up" aria-label="Up">▲</button>
        <button class="btn left" data-dir="left" aria-label="Left">◀</button>
        <button class="btn center" id="pause-btn" aria-label="Pause">❚❚</button>
        <button class="btn right" data-dir="right" aria-label="Right">▶</button>
        <button class="btn down" data-dir="down" aria-label="Down">▼</button>
      </div>
      <p class="hint">Arrow keys · WASD · Swipe</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
